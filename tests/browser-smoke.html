<!doctype html>
<meta charset="utf-8">
<title>Speakable Text browser smoke</title>
<pre id="result" data-status="running">Running browser corpus…</pre>
<script>
  const result = document.querySelector("#result");
  window.reportBrowserSmokeFailure = (error) => {
    result.dataset.status = "failed";
    result.textContent = error instanceof Error ? error.stack : String(error);
  };
</script>
<script
  src="../.verification/browser-smoke.js"
  onerror="reportBrowserSmokeFailure(new Error('Browser smoke bundle is missing. Run `npm run build:browser`, then reload this page.'))"
></script>
